<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast — cover art studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Neon Coast</span><span class="brand-sub">cover art studio</span></div>
  <div class="formats" id="format-list" role="radiogroup" aria-label="Cover size"></div>
  <div class="exports">
    <button id="export-current" class="primary" type="button">Export PNG</button>
    <button id="export-all" type="button">All 3 sizes</button>
  </div>
</header>
<div class="workspace" id="workspace">
  <aside class="sidebar" aria-label="Photos, layout and grade">
    <section class="group">
      <h2><span class="step">1</span>Photos</h2>
      <label class="dropzone" id="dropzone">
        <input id="photo-input" type="file" accept="image/*" multiple>
        <strong>Drop photos here</strong><span>or click to pick several — they stay on this computer</span>
      </label>
      <div class="photo-strip" id="photo-strip"></div>
      <button id="use-samples" class="ghost" type="button">Try the sample photos</button>
    </section>
    <section class="group">
      <h2><span class="step">2</span>Layout</h2>
      <div class="layout-list" id="layout-list"></div>
    </section>
    <section class="group">
      <h2><span class="step">3</span>Colour grade</h2>
      <div class="grade-list" id="grade-list"></div>
    </section>
  </aside>
  <main class="stage" id="stage">
    <div class="canvas-frame" id="canvas-frame"><canvas id="preview" aria-label="Cover preview"></canvas></div>
    <p class="hint">Click a panel to select it · drag to move the photo · scroll to zoom · double-click to reset</p>
  </main>
  <aside class="sidebar" aria-label="Caption and panel">
    <section class="group">
      <h2><span class="step">4</span>Caption</h2>
      <label class="field">Title <small>(Enter for a new line)</small><textarea id="title" rows="2" maxlength="48"></textarea></label>
      <label class="field">Neon script<input id="subtitle" type="text" maxlength="40"></label>
      <label class="field">Badge<input id="tagline" type="text" maxlength="24"></label>
      <label class="field">Wanted stars <output id="stars-out"></output><input id="stars" type="range" min="0" max="5" step="1"></label>
    </section>
    <section class="group">
      <h2><span class="step">5</span><span id="panel-label">Panel</span></h2>
      <div class="panel-photos" id="panel-photos"></div>
      <label class="field">Zoom <output id="zoom-out"></output><input id="zoom" type="range" min="1" max="5" step="0.01"></label>
      <div class="row">
        <button id="reset-crop" class="ghost" type="button">Reset crop</button>
        <button id="fill-all" class="ghost" type="button">Use in every panel</button>
      </div>
    </section>
    <section class="group">
      <h2><span class="step">6</span>Finish</h2>
      <label class="field">Film grain <output id="grain-out"></output><input id="grain" type="range" min="0" max="1" step="0.01"></label>
      <label class="check"><input id="vignette" type="checkbox"> Vignette</label>
      <button id="shuffle" class="ghost" type="button">Shuffle photos across panels</button>
    </section>
    <p class="status" id="status" role="status"></p>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
